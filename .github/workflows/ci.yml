name: CI/CD Pipeline - EP2

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Pruebas y medicion de cobertura con JaCoCo (IE2)
  test-and-coverage:
    name: Pruebas y Cobertura JaCoCo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas, generar reporte y verificar umbral JaCoCo
        run: mvn clean verify

      - name: Subir reporte de JaCoCo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # 2. Analisis de seguridad y escaneo de vulnerabilidades con bloqueo real (IE3)
  security-scan:
    name: Escaneo de Seguridad Snyk
    runs-on: ubuntu-latest
    needs: test-and-coverage
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Verificar token Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "ERROR: SNYK_TOKEN no esta configurado en los Secrets del repositorio"
            exit 1
          fi

      - name: Autenticar y escanear dependencias con Snyk (bloquea ante severidad critica)
     env:
       SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
     run: |
       snyk auth "$SNYK_TOKEN"
       snyk test --severity-threshold=critical --json > snyk-report.json

      - name: Subir reporte de seguridad Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-security-report
          path: snyk-report.json

  # 3. Analisis estatico de codigo y Quality Gates con bloqueo (IE2/IE3)
  sonarcloud-analysis:
    name: Analisis SonarCloud
    runs-on: ubuntu-latest
    needs: [test-and-coverage, security-scan]
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verificar token SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN no esta configurado"
            exit 1
          fi

      - name: Ejecutar pruebas, cobertura y SonarCloud (con Quality Gate bloqueante)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.organization=kevishowardgonzalez \
            -Dsonar.projectKey=kevishowardgonzalez_EstadisticasMs-Devops \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  # 4. Construccion de imagen Docker Multi-Stage etiquetada por SHA (IE1/IE4)
  docker-build:
    name: Construccion de Contenedor Docker
    runs-on: ubuntu-latest
    needs: [test-and-coverage, security-scan, sonarcloud-analysis]
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y etiquetar imagen Docker con SHA del commit
        run: |
          docker build -t estadisticas-ms:${{ github.sha }} -t estadisticas-ms:latest -f Dockerfile .
          docker images | grep estadisticas-ms

  # 5. Despliegue automatico en entorno simulado y Smoke Test (IE4/IE5)
  deploy-simulado:
    name: Despliegue Simulado con Docker Compose
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar variables de entorno
        run: cp .env.example .env

      - name: Levantar stack completo (MariaDB + Microservicio)
        run: docker compose up -d --build

      - name: Verificar estado de contenedores y probar API
        run: |
          sleep 30
          docker compose ps
          curl -f http://localhost:8082/api/estadisticas

      - name: Detener entorno simulado
        if: always()
        run: docker compose down -v