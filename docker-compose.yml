services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb-estadisticas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./src/main/resources/db_estadisticas:/docker-entrypoint-initdb.d:ro
    networks:
      - red-estadisticas
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  estadisticas-ms:
    build:
      context: .
      dockerfile: Dockerfile
    image: estadisticas-ms:latest
    container_name: estadisticas-ms-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - red-estadisticas
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8082/api/estadisticas || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  mariadb_data:

networks:
  red-estadisticas:
    driver: bridge
